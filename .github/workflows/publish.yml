name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  official:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Enable Yarn 1
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build the package
        run: yarn build:lib
      - name: Check for an existing publication
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, mkdtempSync, rmSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { spawnSync } from 'node:child_process'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag must match package.json version')
          const result = spawnSync('npm', ['view', `${name}@${version}`, '--json'], { encoding: 'utf8' })
          if (result.status === 0) {
            const published = JSON.parse(result.stdout)
            if (published.gitHead) {
              if (published.gitHead !== process.env.GITHUB_SHA) throw new Error('Published version belongs to another commit')
            } else {
              // Publishing a tested .tgz may omit gitHead. Verify the exact
              // rebuilt package instead of treating missing metadata as identity.
              const directory = mkdtempSync(join(tmpdir(), 'canvas-release-'))
              try {
                const pack = spawnSync('npm', ['pack', '--ignore-scripts', '--json', '--pack-destination', directory], { encoding: 'utf8' })
                if (pack.status !== 0) throw new Error(pack.stderr || 'Package verification failed')
                const [{ integrity }] = JSON.parse(pack.stdout)
                if (!integrity || integrity !== published.dist?.integrity) throw new Error('Published tarball differs from this build')
              } finally { rmSync(directory, { recursive: true, force: true }) }
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n')
          } else {
            let error
            try { error = JSON.parse(result.stdout).error } catch {}
            if (error?.code !== 'E404') throw new Error(result.stderr || 'Registry check failed')
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n')
          }
          JS
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [official, publish]
    if: needs.official.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file CHANGELOG.md
